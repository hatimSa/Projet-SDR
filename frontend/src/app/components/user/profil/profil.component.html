<div class="container">
  <h1>Bienvenue, {{ profilForm.get('prenom')?.value }} !</h1>
  <img src="assets/images/123.jpg" width="100" height="100" class="img-circle" style="float: right;" alt="Photo de profil">

  <form [formGroup]="profilForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Nom :</label>
      <input type="text" formControlName="nom" class="form-control" placeholder="Nom">
    </div>

    <div class="form-group">
      <label>Prénom :</label>
      <input type="text" formControlName="prenom" class="form-control" placeholder="Prénom">
    </div>

    <div class="form-group">
      <label>Sexe :</label>
      <select formControlName="sexe" class="form-control">
        <option value="M">Masculin</option>
        <option value="F">Féminin</option>
      </select>
    </div>

    <div class="form-group">
      <label>Date de naissance :</label>
      <input type="date" formControlName="dateNaissance" class="form-control">
    </div>

    <div class="form-group">
      <label>Lieu de naissance :</label>
      <input type="text" formControlName="lieuNaissance" class="form-control" placeholder="Lieu de naissance">
    </div>

    <div class="form-group">
      <label>Email :</label>
      <input type="email" formControlName="email" class="form-control" placeholder="Email">
    </div>

    <div class="form-group">
      <label>Téléphone :</label>
      <input type="text" formControlName="telephone" class="form-control" placeholder="+212 6 xxx xxxx">
    </div>

    <div class="form-group">
      <label>Login :</label>
      <input type="text" formControlName="login" class="form-control" placeholder="Login">
    </div>

    <button type="submit" class="btn btn-success">Enregistrer</button>
  </form>
</div>
