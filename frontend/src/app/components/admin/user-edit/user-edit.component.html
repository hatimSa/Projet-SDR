<div class="container mt-5 user-form-container">
  <h2>{{ userId ? 'Edit User' : 'Add New User' }}</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" class="form-control" formControlName="username" />
      <div *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched" class="text-danger">
        Username is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" class="form-control" formControlName="email" />
      <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="text-danger">
        Valid email is required.
      </div>
    </div>

    <div class="mb-3" *ngIf="!userId">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password" />
    </div>

    <!-- UserDetails fields -->
    <div formGroupName="userDetails">
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input id="firstName" class="form-control" formControlName="firstName" />
      </div>

      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input id="lastName" class="form-control" formControlName="lastName" />
      </div>

      <div class="mb-3">
        <label for="phoneNumber" class="form-label">Phone Number</label>
        <input id="phoneNumber" class="form-control" formControlName="phoneNumber" />
      </div>

      <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <input id="country" class="form-control" formControlName="country" />
      </div>

      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input id="city" class="form-control" formControlName="city" />
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input id="address" class="form-control" formControlName="address" />
      </div>

      <div class="mb-3">
        <label for="postalCode" class="form-label">Postal Code</label>
        <input id="postalCode" class="form-control" formControlName="postalCode" />
      </div>

      <div class="mb-3">
        <label for="aboutMe" class="form-label">About Me</label>
        <textarea id="aboutMe" class="form-control" formControlName="aboutMe" rows="3"></textarea>
      </div>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="userForm.invalid">
      {{ userId ? 'Update' : 'Create' }} User
    </button>
    <button class="btn btn-secondary ms-2" type="button" (click)="router.navigate(['/admin/users'])">Cancel</button>
  </form>
</div>
