<div class="container mt-5 user-form-container">
  <h2>{{ userId ? 'Edit User' : 'Add New User' }}</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <!-- Username -->
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" class="form-control" formControlName="username" />
      <div *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched" class="text-danger">
        Username is required.
      </div>
      <div *ngIf="errorMessages?.username" class="text-danger">
        {{ errorMessages.username }}
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" class="form-control" formControlName="email" />
      <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="text-danger">
        Valid email is required.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3" *ngIf="!userId">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password" />
      <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="text-danger">
        Password is required.
      </div>
      <div *ngIf="errorMessages?.password" class="text-danger">
        {{ errorMessages.password }}
      </div>
    </div>

    <!-- Role -->
    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select id="role" class="form-select" formControlName="role">
        <option value="" disabled>Select a role</option>
        <option value="USER">User</option>
        <option value="ADMIN">Admin</option>
      </select>
      <div *ngIf="userForm.get('role')?.invalid && userForm.get('role')?.touched" class="text-danger">
        Role is required.
      </div>
    </div>

    <!-- Active Status -->
    <div class="mb-3">
      <label for="active" class="form-label">Status</label>
      <select id="active" class="form-select" formControlName="active">
        <option value="" disabled>Select status</option>
        <option value="ACTIVE">Active</option>
        <option value="INACTIVE">Inactive</option>
      </select>
      <div *ngIf="userForm.get('active')?.invalid && userForm.get('active')?.touched" class="text-danger">
        Status is required.
      </div>
    </div>

    <!-- Buttons -->
    <button class="btn btn-primary" type="submit" [disabled]="userForm.invalid">
      {{ userId ? 'Update' : 'Create' }} User
    </button>
    <button class="btn btn-secondary ms-2" type="button" (click)="router.navigate(['/admin/users'])">Cancel</button>
  </form>
</div>
