<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Role Management</h2>
    <button class="btn btn-success" [routerLink]="['/admin/roles/add']" routerLinkActive="active">
      + Add Role
    </button>
  </div>

  <table class="table table-striped table-hover" *ngIf="roles && roles.length > 0; else noRoles">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Role Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of roles">
        <td>{{ role.id }}</td>
        <td>{{ role.name }}</td>
        <td>
          <button class="btn btn-primary btn-sm mr-2" (click)="editRole(role)">Edit</button>
          <button class="btn btn-danger btn-sm" (click)="deleteRole(role.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noRoles>
    <div class="alert alert-info text-center">Aucun rôle trouvé.</div>
  </ng-template>
</div>
