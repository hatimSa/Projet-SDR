<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>User Management</h2>
    <button class="btn btn-success" (click)="addUser()">+ Add User</button>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>
        <button class="btn btn-primary btn-sm me-2" (click)="editUser(user)">Edit</button>
        <button class="btn btn-danger btn-sm" (click)="deleteUser(user.id)">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>User Management</h2>
    <button class="btn btn-success" (click)="addUser()">+ Add User</button>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>État</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>
          <span class="badge" [ngClass]="user.etat === 1 ? 'bg-success' : 'bg-secondary'">
            {{ user.etat === 1 ? 'Actif' : 'Inactif' }}
          </span>
        </td>
        <td>
          <button class="btn btn-primary btn-sm me-2" (click)="editUser(user)">Edit</button>
          <button class="btn btn-danger btn-sm me-2" (click)="deleteUser(user.id)">Delete</button>
          <button
            class="btn btn-sm"
            [ngClass]="user.etat === 1 ? 'btn-warning' : 'btn-success'"
            (click)="toggleUserEtat(user)"
          >
            {{ user.etat === 1 ? 'Désactiver' : 'Activer' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
