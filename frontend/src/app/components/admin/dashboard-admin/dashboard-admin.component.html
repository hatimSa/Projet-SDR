<div class="container-fluid">
  <div class="row flex-nowrap">
    <div class="col py-3">
      <div class="welcome-section">
        <h2>Welcome Back, Admin!</h2>
        <p class="mb-0">Here's an overview of your user & role management system.</p>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-4" *ngFor="let stat of stats">
          <div class="card stat-card text-white h-100" [ngClass]="stat.bg">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div>
                  <h6 class="card-title">{{ stat.title }}</h6>
                  <h2 class="mb-0">{{ stat.value }}</h2>
                </div>
                <div class="fs-1">
                  <i class="bi" [ngClass]="stat.icon"></i>
                </div>
              </div>
              <div class="mt-3">
                <span class="text-white-50">{{ stat.description }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
