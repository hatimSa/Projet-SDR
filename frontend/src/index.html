  <style>
    body {
      background: linear-gradient(120deg, #2980b9, #2c3e50);

    }
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .btn-custom {
      background: linear-gradient(to right, #2980b9, #2c3e50);

      color: white;
    }
    .btn-custom:hover {

      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
