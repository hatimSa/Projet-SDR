apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/springboot-461122/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_APPLICATION_JSON
              value: >
                {
                  "eureka": {
                    "client": {
                      "serviceUrl": {
                        "defaultZone": "http://eureka-server:8761/eureka/"
                      }
                    }
                  }
                }