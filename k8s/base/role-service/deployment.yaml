apiVersion: apps/v1
kind: Deployment
metadata:
  name: role-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: role-service
  template:
    metadata:
      labels:
        app: role-service
    spec:
      containers:
        - name: role-service
          image: gcr.io/springboot-461122/role-service:latest
          ports:
            - containerPort: 8082