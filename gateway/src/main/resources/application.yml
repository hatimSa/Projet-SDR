server:
  port: 8080

spring:
  eureka:
    client:
      service-url:
        defaultZone: http://eureka-server:8761/eureka/
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      httpclient:
        connect-timeout: 60000
        response-timeout: 60s